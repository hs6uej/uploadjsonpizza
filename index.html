<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu JSON Uploader</title>
    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        body {
            background-color: #f8f9fa;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .upload-container {
            max-width: 800px;
            margin: 50px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .file-list {
            margin-top: 30px;
        }
        .drop-zone {
            border: 2px dashed #dee2e6;
            border-radius: 8px;
            padding: 40px;
            text-align: center;
            transition: all 0.3s ease;
            cursor: pointer;
            background: #fff;
        }
        .drop-zone:hover, .drop-zone.dragover {
            border-color: #0d6efd;
            background-color: #f1f7ff;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="upload-container">
            <h2 class="text-center mb-4"><i class="bi bi-filetype-json text-primary"></i> Menu JSON Uploader</h2>
            
            <div id="dropZone" class="drop-zone mb-3">
                <i class="bi bi-cloud-arrow-up-fill fs-1 text-secondary"></i>
                <p class="mt-2">Drag & Drop JSON files here or <b>browse</b></p>
                <input type="file" id="fileInput" multiple accept=".json" style="display: none;">
            </div>

            <div id="selectedFiles" class="mb-3"></div>

            <div class="d-grid gap-2">
                <button id="uploadBtn" class="btn btn-primary" disabled>
                    <i class="bi bi-upload"></i> Upload Files
                </button>
            </div>

            <div id="statusMessage" class="mt-3"></div>

            <hr>

            <div class="file-list">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h4><i class="bi bi-folder2-open me-2"></i> Current Menu Files</h4>
                    <button id="refreshBtn" class="btn btn-sm btn-outline-secondary">
                        <i class="bi bi-arrow-clockwise"></i> Refresh
                    </button>
                </div>
                <div class="table-responsive">
                    <table class="table table-hover">
                        <thead>
                            <tr>
                                <th>Filename</th>
                                <th>Size</th>
                                <th>Last Modified</th>
                            </tr>
                        </thead>
                        <tbody id="fileTableBody">
                            <!-- Files will be listed here -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const uploadBtn = document.getElementById('uploadBtn');
        const selectedFilesDiv = document.getElementById('selectedFiles');
        const fileTableBody = document.getElementById('fileTableBody');
        const statusMessage = document.getElementById('statusMessage');
        const refreshBtn = document.getElementById('refreshBtn');

        let filesToUpload = [];

        // UI Helpers
        function showStatus(message, type) {
            statusMessage.innerHTML = `<div class="alert alert-${type} alert-dismissible fade show" role="alert">
                ${message}
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>`;
        }

        function formatBytes(bytes, decimals = 2) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const dm = decimals < 0 ? 0 : decimals;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(dm)) + ' ' + sizes[i];
        }

        // Drag & Drop Handlers
        dropZone.addEventListener('click', () => fileInput.click());

        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('dragover');
        });

        dropZone.addEventListener('dragleave', () => {
            dropZone.classList.remove('dragover');
        });

        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            handleFiles(e.dataTransfer.files);
        });

        fileInput.addEventListener('change', (e) => {
            handleFiles(e.target.files);
        });

        function handleFiles(files) {
            const jsonFiles = Array.from(files).filter(f => f.name.toLowerCase().endsWith('.json'));
            
            if (jsonFiles.length === 0) {
                showStatus('Please select JSON files only.', 'warning');
                return;
            }

            filesToUpload = jsonFiles;
            uploadBtn.disabled = filesToUpload.length === 0;
            
            selectedFilesDiv.innerHTML = `<strong>Selected:</strong> ${filesToUpload.length} file(s)<br>` + 
                filesToUpload.map(f => `<span class="badge bg-light text-dark border me-1">${f.name}</span>`).join('');
        }

        // List Files
        async function loadFileList() {
            try {
                const response = await fetch('/api/files');
                const files = await response.json();
                
                fileTableBody.innerHTML = '';
                if (files.length === 0) {
                    fileTableBody.innerHTML = '<tr><td colspan="3" class="text-center text-muted">No files found</td></tr>';
                    return;
                }

                files.sort((a, b) => new Date(b.modified) - new Date(a.modified));

                files.forEach(file => {
                    const row = `<tr>
                        <td><i class="bi bi-file-earmark-code me-2"></i>${file.name}</td>
                        <td>${formatBytes(file.size)}</td>
                        <td>${new Date(file.modified).toLocaleString()}</td>
                    </tr>`;
                    fileTableBody.innerHTML += row;
                });
            } catch (err) {
                showStatus('Error loading file list.', 'danger');
            }
        }

        // Upload
        uploadBtn.addEventListener('click', async () => {
            if (filesToUpload.length === 0) return;

            const formData = new FormData();
            for (let i = 0; i < filesToUpload.length; i++) {
                formData.append('files', filesToUpload[i]);
            }

            uploadBtn.disabled = true;
            uploadBtn.innerHTML = '<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span> Uploading...';

            try {
                const response = await fetch('/api/upload', {
                    method: 'POST',
                    body: formData
                });

                if (response.ok) {
                    showStatus('Files uploaded successfully!', 'success');
                    filesToUpload = [];
                    selectedFilesDiv.innerHTML = '';
                    uploadBtn.disabled = true;
                    loadFileList();
                } else {
                    const data = await response.json();
                    showStatus(data.error || 'Upload failed.', 'danger');
                }
            } catch (err) {
                showStatus('Server connection error.', 'danger');
            } finally {
                uploadBtn.innerHTML = '<i class="bi bi-upload"></i> Upload Files';
            }
        });

        refreshBtn.addEventListener('click', loadFileList);

        // Initial load
        loadFileList();
    </script>
</body>
</html>
